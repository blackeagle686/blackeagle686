<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0F"/>
      <stop offset="100%" style="stop-color:#13131A"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF4500"/>
      <stop offset="60%" style="stop-color:#FF7A3D"/>
      <stop offset="100%" style="stop-color:#FF450000"/>
    </linearGradient>
    <filter id="blur-glow">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FF4500" stroke-width="0.4" stroke-opacity="0.14"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="900" height="300" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="900" height="300" fill="url(#bg)"/>
    <rect width="900" height="300" fill="url(#grid)"/>
    <circle cx="800" cy="-30" r="220" fill="#FF4500" opacity="0.09" filter="url(#blur-glow)"/>
    <circle cx="60"  cy="330" r="180" fill="#FF7A3D" opacity="0.06" filter="url(#blur-glow)"/>
    <rect width="900" height="300" rx="16" fill="none" stroke="#FF4500" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="0" y="0" width="900" height="4" rx="1" fill="url(#accent-line)"/>

    <!-- Status pill -->
    <rect x="48" y="40" width="224" height="30" rx="15" fill="#FF4500" fill-opacity="0.13" stroke="#FF4500" stroke-width="1" stroke-opacity="0.55"/>
    <circle cx="67" cy="55" r="5" fill="#FF4500">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="82" y="61" font-family="'Courier New', monospace" font-size="13" font-weight="600" fill="#FF4500" letter-spacing="1">available for work</text>

    <!-- Name -->
    <text x="48" y="138" font-family="Arial Black, Arial" font-size="60" font-weight="900" fill="#FFFFFF" letter-spacing="-1">Mohamed</text>
    <text x="48" y="198" font-family="Arial Black, Arial" font-size="60" font-weight="900" fill="#FF4500"  letter-spacing="-1">Alaa.</text>

    <!-- Accent line -->
    <rect x="48" y="213" width="72" height="4" rx="2" fill="#FF4500"/>

    <!-- Role -->
    <text x="48" y="244" font-family="'Courier New', monospace" font-size="16" font-weight="600" fill="#FFFFFF" letter-spacing="0.4">AI Engineer  &amp;  Backend Developer</text>

    <!-- Tagline -->
    <text x="48" y="270" font-family="'Courier New', monospace" font-size="13" fill="#BBBBBB" letter-spacing="0.3">// Building systems that think and scale</text>

    <!-- Code block -->
    <rect x="566" y="46" width="306" height="214" rx="12" fill="#0D0D14" stroke="#FF4500" stroke-width="0.8" stroke-opacity="0.35"/>
    <rect x="566" y="46" width="306" height="32"  rx="12" fill="#111118"/>
    <rect x="566" y="64"  width="306" height="14"  fill="#111118"/>
    <circle cx="589" cy="62" r="6" fill="#FF4500" opacity="0.75"/>
    <circle cx="607" cy="62" r="6" fill="#FF7A3D" opacity="0.55"/>
    <circle cx="625" cy="62" r="6" fill="#FF9966" opacity="0.4"/>
    <text x="648" y="68" font-family="'Courier New', monospace" font-size="12" fill="#FFFFFF" opacity="0.4">profile.py</text>

    <text x="584" y="108" font-family="'Courier New', monospace" font-size="15" fill="#FF4500">class</text>
    <text x="630" y="108" font-family="'Courier New', monospace" font-size="15" fill="#FFFFFF">Engineer</text>
    <text x="710" y="108" font-family="'Courier New', monospace" font-size="15" fill="#FFFFFF" opacity="0.45">:</text>

    <text x="584" y="132" font-family="'Courier New', monospace" font-size="14" fill="#BBBBBB">  role</text>
    <text x="626" y="132" font-family="'Courier New', monospace" font-size="14" fill="#BBBBBB"> = </text>
    <text x="650" y="132" font-family="'Courier New', monospace" font-size="14" fill="#FF7A3D">"AI + Backend"</text>

    <text x="584" y="156" font-family="'Courier New', monospace" font-size="14" fill="#BBBBBB">  stack</text>
    <text x="636" y="156" font-family="'Courier New', monospace" font-size="14" fill="#BBBBBB"> = </text>
    <text x="658" y="156" font-family="'Courier New', monospace" font-size="13" fill="#FF7A3D">["PyTorch","Django"]</text>

    <text x="584" y="180" font-family="'Courier New', monospace" font-size="14" fill="#BBBBBB">  focus</text>
    <text x="636" y="180" font-family="'Courier New', monospace" font-size="14" fill="#BBBBBB"> = </text>
    <text x="658" y="180" font-family="'Courier New', monospace" font-size="14" fill="#FF7A3D">"scalable AI"</text>

    <text x="584" y="204" font-family="'Courier New', monospace" font-size="14" fill="#BBBBBB">  location</text>
    <text x="660" y="204" font-family="'Courier New', monospace" font-size="14" fill="#BBBBBB"> = </text>
    <text x="682" y="204" font-family="'Courier New', monospace" font-size="14" fill="#FF7A3D">"Egypt"</text>

    <text x="584" y="234" font-family="'Courier New', monospace" font-size="15" fill="#FF4500">  &gt;&gt;&gt;</text>
    <text x="614" y="234" font-family="'Courier New', monospace" font-size="15" fill="#FFFFFF"> open_to_work()</text>
    <rect x="756" y="221" width="9" height="16" rx="1" fill="#FF4500">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
