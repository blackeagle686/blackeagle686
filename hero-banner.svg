<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0F"/>
      <stop offset="100%" style="stop-color:#13131A"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF4500"/>
      <stop offset="60%" style="stop-color:#FF7A3D"/>
      <stop offset="100%" style="stop-color:#FF450000"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4500;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur-glow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FF4500" stroke-width="0.3" stroke-opacity="0.12"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="900" height="280" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Background -->
    <rect width="900" height="280" fill="url(#bg)"/>
    <!-- Grid -->
    <rect width="900" height="280" fill="url(#grid)"/>
    <!-- Glow orb top-right -->
    <circle cx="780" cy="-20" r="200" fill="#FF4500" opacity="0.07" filter="url(#blur-glow)"/>
    <!-- Glow orb bottom-left -->
    <circle cx="80" cy="300" r="160" fill="#FF7A3D" opacity="0.05" filter="url(#blur-glow)"/>

    <!-- Border -->
    <rect width="900" height="280" rx="16" fill="none" stroke="#FF4500" stroke-width="1" stroke-opacity="0.25"/>

    <!-- Top accent line -->
    <rect x="0" y="0" width="900" height="3" rx="1" fill="url(#accent-line)"/>

    <!-- Status pill -->
    <rect x="48" y="44" width="198" height="24" rx="12" fill="#FF4500" fill-opacity="0.12" stroke="#FF4500" stroke-width="0.8" stroke-opacity="0.5"/>
    <circle cx="64" cy="56" r="4" fill="#FF4500">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="76" y="61" font-family="'Courier New', monospace" font-size="11" fill="#FF4500" letter-spacing="1">available for work</text>

    <!-- Name -->
    <text x="48" y="118" font-family="Arial Black, Arial" font-size="52" font-weight="900" fill="#F0EEE8" letter-spacing="-1">Mohamed</text>
    <text x="48" y="172" font-family="Arial Black, Arial" font-size="52" font-weight="900" fill="#FF4500" letter-spacing="-1">Alaa.</text>

    <!-- Separator line -->
    <rect x="48" y="190" width="60" height="3" rx="1" fill="#FF4500"/>

    <!-- Role text -->
    <text x="48" y="220" font-family="'Courier New', monospace" font-size="13" fill="#F0EEE8" opacity="0.6" letter-spacing="0.5">AI Engineer  &amp;  Backend Developer</text>

    <!-- Tagline -->
    <text x="48" y="244" font-family="'Courier New', monospace" font-size="11" fill="#F0EEE8" opacity="0.35" letter-spacing="0.3">// Building systems that think and scale</text>

    <!-- Right side — decorative code block -->
    <rect x="580" y="56" width="284" height="174" rx="10" fill="#0D0D14" stroke="#FF4500" stroke-width="0.6" stroke-opacity="0.3"/>
    <!-- Code block top bar -->
    <rect x="580" y="56" width="284" height="28" rx="10" fill="#111118"/>
    <rect x="580" y="70" width="284" height="14" fill="#111118"/>
    <circle cx="600" cy="70" r="5" fill="#FF4500" opacity="0.7"/>
    <circle cx="616" cy="70" r="5" fill="#FF7A3D" opacity="0.5"/>
    <circle cx="632" cy="70" r="5" fill="#FF9966" opacity="0.35"/>
    <text x="660" y="74" font-family="'Courier New', monospace" font-size="10" fill="#F0EEE8" opacity="0.3">profile.py</text>

    <!-- Code lines -->
    <text x="596" y="106" font-family="'Courier New', monospace" font-size="11" fill="#FF4500" opacity="0.8">class</text>
    <text x="636" y="106" font-family="'Courier New', monospace" font-size="11" fill="#F0EEE8" opacity="0.9">Engineer</text>
    <text x="694" y="106" font-family="'Courier New', monospace" font-size="11" fill="#F0EEE8" opacity="0.4">:</text>

    <text x="596" y="124" font-family="'Courier New', monospace" font-size="11" fill="#F0EEE8" opacity="0.35">  role</text>
    <text x="630" y="124" font-family="'Courier New', monospace" font-size="11" fill="#F0EEE8" opacity="0.35"> = </text>
    <text x="648" y="124" font-family="'Courier New', monospace" font-size="11" fill="#FF7A3D" opacity="0.9">"AI + Backend"</text>

    <text x="596" y="142" font-family="'Courier New', monospace" font-size="11" fill="#F0EEE8" opacity="0.35">  stack</text>
    <text x="636" y="142" font-family="'Courier New', monospace" font-size="11" fill="#F0EEE8" opacity="0.35"> = </text>
    <text x="654" y="142" font-family="'Courier New', monospace" font-size="11" fill="#FF7A3D" opacity="0.9">["PyTorch","Django"]</text>

    <text x="596" y="160" font-family="'Courier New', monospace" font-size="11" fill="#F0EEE8" opacity="0.35">  focus</text>
    <text x="636" y="160" font-family="'Courier New', monospace" font-size="11" fill="#F0EEE8" opacity="0.35"> = </text>
    <text x="654" y="160" font-family="'Courier New', monospace" font-size="11" fill="#FF7A3D" opacity="0.9">"scalable AI"</text>

    <text x="596" y="178" font-family="'Courier New', monospace" font-size="11" fill="#F0EEE8" opacity="0.35">  location</text>
    <text x="654" y="178" font-family="'Courier New', monospace" font-size="11" fill="#F0EEE8" opacity="0.35"> = </text>
    <text x="678" y="178" font-family="'Courier New', monospace" font-size="11" fill="#FF7A3D" opacity="0.9">"Egypt 🇪🇬"</text>

    <text x="596" y="200" font-family="'Courier New', monospace" font-size="11" fill="#FF4500" opacity="0.6">  &gt;&gt;&gt;</text>
    <text x="618" y="200" font-family="'Courier New', monospace" font-size="11" fill="#F0EEE8" opacity="0.5"> open_to_work()</text>
    <rect x="730" y="191" width="7" height="12" fill="#FF4500" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
