<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0F"/>
      <stop offset="100%" style="stop-color:#13131A"/>
    </linearGradient>
    <clipPath id="r"><rect width="900" height="160" rx="14"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FF4500" stroke-width="0.3" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <g clip-path="url(#r)">
    <rect width="900" height="160" fill="url(#bg)"/>
    <rect width="900" height="160" fill="url(#grid)"/>
    <rect width="900" height="160" rx="14" fill="none" stroke="#FF4500" stroke-width="0.8" stroke-opacity="0.2"/>

    <!-- Card 1: Backend -->
    <rect x="16" y="16" width="274" height="128" rx="10" fill="#111118" stroke="#FF4500" stroke-width="0.6" stroke-opacity="0.3"/>
    <rect x="16" y="16" width="274" height="3" rx="1" fill="#FF4500" opacity="0.8"/>
    <text x="32" y="46" font-family="Arial" font-size="13" font-weight="bold" fill="#FF4500">⬡ Backend Engineering</text>
    <text x="32" y="66" font-family="'Courier New', monospace" font-size="10" fill="#F0EEE8" opacity="0.5">› RESTful &amp; GraphQL APIs</text>
    <text x="32" y="82" font-family="'Courier New', monospace" font-size="10" fill="#F0EEE8" opacity="0.5">› Microservices architecture</text>
    <text x="32" y="98" font-family="'Courier New', monospace" font-size="10" fill="#F0EEE8" opacity="0.5">› Query optimization &amp; caching</text>
    <text x="32" y="114" font-family="'Courier New', monospace" font-size="10" fill="#F0EEE8" opacity="0.5">› Auth &amp; security layers</text>
    <text x="32" y="130" font-family="'Courier New', monospace" font-size="10" fill="#F0EEE8" opacity="0.5">› Unit &amp; integration testing</text>

    <!-- Card 2: AI -->
    <rect x="314" y="16" width="274" height="128" rx="10" fill="#111118" stroke="#FF4500" stroke-width="0.6" stroke-opacity="0.3"/>
    <rect x="314" y="16" width="274" height="3" rx="1" fill="#FF7A3D" opacity="0.8"/>
    <text x="330" y="46" font-family="Arial" font-size="13" font-weight="bold" fill="#FF7A3D">◈ AI Engineering</text>
    <text x="330" y="66" font-family="'Courier New', monospace" font-size="10" fill="#F0EEE8" opacity="0.5">› Model training &amp; fine-tuning</text>
    <text x="330" y="82" font-family="'Courier New', monospace" font-size="10" fill="#F0EEE8" opacity="0.5">› Production ML deployment</text>
    <text x="330" y="98" font-family="'Courier New', monospace" font-size="10" fill="#F0EEE8" opacity="0.5">› MLOps &amp; CI/CD pipelines</text>
    <text x="330" y="114" font-family="'Courier New', monospace" font-size="10" fill="#F0EEE8" opacity="0.5">› NLP &amp; Computer Vision</text>
    <text x="330" y="130" font-family="'Courier New', monospace" font-size="10" fill="#F0EEE8" opacity="0.5">› RAG system design</text>

    <!-- Card 3: Data -->
    <rect x="612" y="16" width="274" height="128" rx="10" fill="#111118" stroke="#FF4500" stroke-width="0.6" stroke-opacity="0.3"/>
    <rect x="612" y="16" width="274" height="3" rx="1" fill="#FF9966" opacity="0.8"/>
    <text x="628" y="46" font-family="Arial" font-size="13" font-weight="bold" fill="#FF9966">◎ Data &amp; Databases</text>
    <text x="628" y="66" font-family="'Courier New', monospace" font-size="10" fill="#F0EEE8" opacity="0.5">› Schema design &amp; normalization</text>
    <text x="628" y="82" font-family="'Courier New', monospace" font-size="10" fill="#F0EEE8" opacity="0.5">› Performance tuning</text>
    <text x="628" y="98" font-family="'Courier New', monospace" font-size="10" fill="#F0EEE8" opacity="0.5">› Replication &amp; sharding</text>
    <text x="628" y="114" font-family="'Courier New', monospace" font-size="10" fill="#F0EEE8" opacity="0.5">› Vector database integration</text>
    <text x="628" y="130" font-family="'Courier New', monospace" font-size="10" fill="#F0EEE8" opacity="0.5">› PostgreSQL · MySQL · Redis</text>
  </g>
</svg>
