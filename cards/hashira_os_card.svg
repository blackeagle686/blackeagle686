<svg width="100%" viewBox="0 0 810 370" xmlns="http://www.w3.org/2000/svg" font-family="monospace" role="img">
  <title>Hashira-OS — Nine-Agent AI Operating System</title>
  <desc>Master card for Hashira-OS, an AI operating system powered by 9 complete autonomous agents</desc>
  <defs>

    <!-- Gold shimmer border -->
    <linearGradient id="borderG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#B8860B"/>
      <stop offset="25%"  stop-color="#FFD700"/>
      <stop offset="50%"  stop-color="#FFFACD"/>
      <stop offset="75%"  stop-color="#DAA520"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>

    <!-- Button gold -->
    <linearGradient id="btnG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8B6914"/>
      <stop offset="50%"  stop-color="#DAA520"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <!-- Top accent bar -->
    <linearGradient id="topbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFD700"/>
      <stop offset="50%"  stop-color="#FFFACD"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </linearGradient>

    <!-- Aura glow left — warm gold -->
    <radialGradient id="glowLeft" cx="5%" cy="50%" r="45%">
      <stop offset="0%"   stop-color="#DAA520" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>

    <!-- Aura glow right — pale white -->
    <radialGradient id="glowRight" cx="95%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#FFFACD" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>

    <!-- Aura glow center top — holy white beam -->
    <radialGradient id="glowTop" cx="50%" cy="0%" r="55%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>

    <!-- Badge gradient -->
    <linearGradient id="badgeG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8B6914"/>
      <stop offset="50%"  stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <!-- Title gradient -->
    <linearGradient id="titleG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="40%"  stop-color="#FFD700"/>
      <stop offset="70%"  stop-color="#FFFACD"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>

    <!-- Agent pill subtle gold -->
    <linearGradient id="pillG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#DAA520" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Aura halo decorative -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFD700" stop-opacity="0.10"/>
      <stop offset="60%"  stop-color="#FFD700" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- ══ FRAME ══════════════════════════════════════════════ -->
  <!-- Outer gold border -->
  <rect width="800" height="360" rx="20" fill="url(#borderG)"/>
  <!-- Deep black inner card -->
  <rect x="2" y="2" width="796" height="356" rx="18" fill="#080808"/>
  <!-- Ambient glows -->
  <rect x="2" y="2" width="796" height="356" rx="18" fill="url(#glowLeft)"/>
  <rect x="2" y="2" width="796" height="356" rx="18" fill="url(#glowRight)"/>
  <rect x="2" y="2" width="796" height="356" rx="18" fill="url(#glowTop)"/>
  <!-- Top gold accent line -->
  <rect x="2" y="2" width="796" height="3" rx="2" fill="url(#topbar)"/>

  <!-- ══ DECORATIVE AURA HALO (right) ═══════════════════════ -->
  <circle cx="700" cy="170" r="110" fill="url(#halo)"/>
  <!-- Fine concentric ring motif -->
  <circle cx="700" cy="170" r="76"  fill="none" stroke="#DAA520" stroke-width="0.5" stroke-opacity="0.08"/>
  <circle cx="700" cy="170" r="52"  fill="none" stroke="#FFD700" stroke-width="0.5" stroke-opacity="0.10"/>
  <circle cx="700" cy="170" r="30"  fill="none" stroke="#FFFACD" stroke-width="0.5" stroke-opacity="0.10"/>
  <!-- Cross hair lines -->
  <line x1="700" y1="100" x2="700" y2="240" stroke="#FFD700" stroke-width="0.4" stroke-opacity="0.07"/>
  <line x1="630" y1="170" x2="770" y2="170" stroke="#FFD700" stroke-width="0.4" stroke-opacity="0.07"/>

  <!-- Small star sparks -->
  <g fill="#FFD700" opacity="0.18">
    <circle cx="700" cy="100" r="1.5"/>
    <circle cx="770" cy="170" r="1.2"/>
    <circle cx="700" cy="240" r="1.5"/>
    <circle cx="630" cy="170" r="1.2"/>
    <circle cx="749" cy="121" r="1"/>
    <circle cx="749" cy="219" r="1"/>
    <circle cx="651" cy="121" r="1"/>
    <circle cx="651" cy="219" r="1"/>
  </g>

  <!-- ══ BADGES ══════════════════════════════════════════════ -->
  <rect x="28" y="26" width="150" height="22" rx="11" fill="url(#badgeG)"/>
  <text x="103" y="41" text-anchor="middle" font-size="10" font-weight="700" fill="#080808" letter-spacing="1.2">⚡ AI OPERATING SYS</text>

  <rect x="188" y="26" width="112" height="22" rx="11" fill="none" stroke="#DAA520" stroke-width="1" stroke-opacity="0.45"/>
  <rect x="188" y="26" width="112" height="22" rx="11" fill="#DAA520" fill-opacity="0.07"/>
  <text x="244" y="41" text-anchor="middle" font-size="10" font-weight="600" fill="#DAA520" letter-spacing="0.5">9 Agents</text>

  <rect x="310" y="26" width="96" height="22" rx="11" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.15"/>
  <rect x="310" y="26" width="96" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.03"/>
  <text x="358" y="41" text-anchor="middle" font-size="10" font-weight="600" fill="#888888" letter-spacing="0.5">Coming Soon</text>

  <!-- ══ TITLE ══════════════════════════════════════════════ -->
  <text x="28" y="88" font-size="30" font-weight="700" fill="url(#titleG)" letter-spacing="1">Hashira-OS</text>
  <text x="28" y="113" font-size="11" fill="#3A3220" letter-spacing="0.3">Nine pillars of intelligence · Autonomous · Modular · Production-grade AI-OS</text>

  <!-- ══ THIN GOLD RULE ══════════════════════════════════════ -->
  <line x1="28" y1="126" x2="580" y2="126" stroke="#DAA520" stroke-opacity="0.16" stroke-width="0.8"/>

  <!-- ══ AGENT PILLS  (3 rows × 3) ══════════════════════════ -->

  <!-- Row 1 -->
  <!-- Shinobu -->
  <rect x="28"  y="136" width="168" height="48" rx="8" fill="url(#pillG)" stroke="#DAA520" stroke-opacity="0.18" stroke-width="0.8"/>
  <circle cx="46" cy="152" r="3" fill="#FFD700"/>
  <text x="56"  y="153" font-size="10" font-weight="700" fill="#FFD700"   letter-spacing="0.6">SHINOBU</text>
  <text x="46"  y="168" font-size="10" fill="#555544">NL Interface · OS Bridge</text>
  <text x="46"  y="180" font-size="10" fill="#2A2A1A">Human-facing agent</text>

  <!-- Giyu -->
  <rect x="206" y="136" width="168" height="48" rx="8" fill="url(#pillG)" stroke="#DAA520" stroke-opacity="0.18" stroke-width="0.8"/>
  <circle cx="224" cy="152" r="3" fill="#FFFFFF" fill-opacity="0.55"/>
  <text x="234"  y="153" font-size="10" font-weight="700" fill="#CCCCCC" letter-spacing="0.6">GIYU</text>
  <text x="224"  y="168" font-size="10" fill="#555544">Diagnostic Sentinel</text>
  <text x="224"  y="180" font-size="10" fill="#2A2A1A">System integrity</text>

  <!-- Rengoku -->
  <rect x="384" y="136" width="168" height="48" rx="8" fill="url(#pillG)" stroke="#DAA520" stroke-opacity="0.18" stroke-width="0.8"/>
  <circle cx="402" cy="152" r="3" fill="#DAA520"/>
  <text x="412"  y="153" font-size="10" font-weight="700" fill="#DAA520" letter-spacing="0.6">RENGOKU</text>
  <text x="402"  y="168" font-size="10" fill="#555544">Execution Powerhouse</text>
  <text x="402"  y="180" font-size="10" fill="#2A2A1A">Task execution engine</text>

  <!-- Row 2 -->
  <!-- Gyomei -->
  <rect x="28"  y="194" width="168" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.02" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="0.8"/>
  <circle cx="46" cy="210" r="3" fill="#666655"/>
  <text x="56"  y="211" font-size="10" font-weight="700" fill="#888877" letter-spacing="0.6">GYOMEI</text>
  <text x="46"  y="225" font-size="10" fill="#333322">blackeagle686/gyomei</text>
  <text x="46"  y="238" font-size="10" fill="#2A2A1A">Coming soon</text>

  <!-- Obanai -->
  <rect x="206" y="194" width="168" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.02" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="0.8"/>
  <circle cx="224" cy="210" r="3" fill="#666655"/>
  <text x="234"  y="211" font-size="10" font-weight="700" fill="#888877" letter-spacing="0.6">OBANAI</text>
  <text x="224"  y="225" font-size="10" fill="#333322">——</text>
  <text x="224"  y="238" font-size="10" fill="#2A2A1A">Coming soon</text>

  <!-- Muichiro -->
  <rect x="384" y="194" width="168" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.02" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="0.8"/>
  <circle cx="402" cy="210" r="3" fill="#666655"/>
  <text x="412"  y="211" font-size="10" font-weight="700" fill="#888877" letter-spacing="0.6">MUICHIRO</text>
  <text x="402"  y="225" font-size="10" fill="#333322">——</text>
  <text x="402"  y="238" font-size="10" fill="#2A2A1A">Coming soon</text>

  <!-- Row 3 -->
  <!-- Tengen -->
  <rect x="28"  y="252" width="168" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.02" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="0.8"/>
  <circle cx="46" cy="268" r="3" fill="#666655"/>
  <text x="56"  y="269" font-size="10" font-weight="700" fill="#888877" letter-spacing="0.6">TENGEN</text>
  <text x="46"  y="283" font-size="10" fill="#333322">——</text>
  <text x="46"  y="296" font-size="10" fill="#2A2A1A">Coming soon</text>

  <!-- Sanemi -->
  <rect x="206" y="252" width="168" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.02" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="0.8"/>
  <circle cx="224" cy="268" r="3" fill="#666655"/>
  <text x="234"  y="269" font-size="10" font-weight="700" fill="#888877" letter-spacing="0.6">SANEMI</text>
  <text x="224"  y="283" font-size="10" fill="#333322">——</text>
  <text x="224"  y="296" font-size="10" fill="#2A2A1A">Coming soon</text>

  <!-- Slot IX — Reserved -->
  <rect x="384" y="252" width="168" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.01" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="468"  y="272" text-anchor="middle" font-size="10" fill="#2A2A1A" letter-spacing="0.4">· · ·</text>
  <text x="468"  y="288" text-anchor="middle" font-size="10" fill="#1E1E14">Classified</text>

  <!-- ══ CTA BUTTON ══════════════════════════════════════════ -->
  <rect x="28" y="312" width="175" height="36" rx="10" fill="url(#btnG)"/>
  <text x="115" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#080808">View on GitHub →</text>

  <!-- Progress pill -->
  <rect x="214" y="312" width="140" height="36" rx="10" fill="none" stroke="#DAA520" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="214" y="312" width="140" height="36" rx="10" fill="#DAA520" fill-opacity="0.05"/>
  <text x="284" y="325" text-anchor="middle" font-size="10" fill="#DAA520" font-weight="600">BUILD PROGRESS</text>
  <!-- Progress bar track -->
  <rect x="228" y="330" width="112" height="5" rx="3" fill="#FFFFFF" fill-opacity="0.06"/>
  <!-- Progress bar fill — 3/9 complete -->
  <rect x="228" y="330" width="37" height="5" rx="3" fill="#FFD700" fill-opacity="0.7"/>

  <!-- ══ DIVIDER + FOOTER ════════════════════════════════════ -->
  <line x1="28" y1="355" x2="772" y2="355" stroke="#DAA520" stroke-opacity="0.14" stroke-width="0.8"/>
  <text x="28" y="330" font-size="10" fill="#2A2210" letter-spacing="0.4">github.com/blackeagle686 · Hashira-OS · 9-Agent AI Operating System · Building in public</text>

</svg>
